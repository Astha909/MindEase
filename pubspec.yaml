name: mindease
description: Mental Health application for supporting mentally
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.0.0
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  flutter_litert: ^2.0.11


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/mood_classifier.tflite
    - assets/ml/labels.txt
    - assets/ml/tokenizer.json
